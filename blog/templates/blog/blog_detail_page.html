{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ single_post_from_db.title }}</title>
    <meta name="description" content="{{ single_post_from_db.title }} - Blog post">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.1/css/bulma.min.css">
    <script src="https://use.fontawesome.com/releases/v5.15.1/js/all.js"></script>
</head>
<body>
    <section class="section">
        <div class="container" style="max-width: 768px">
            <div class="level" style="margin: 0">
                <div class="level-left">
                    <div class="level-item">
                        <link rel="icon" type="image/x-icon" href="{% static 'blog/static/favicon.ico' %}">
                        <nav class="breadcrumb has-bullet-separator" style="margin: 0; display: inline-block" aria-label="breadcrumbs">
                            <ul>
                                <li><a href="/">Home</a></li>
                                <li><a href="{% url 'blog:blog_list' %}">Blog</a></li>
                                <li class="is-active"><a href="#" aria-current="page">{{ single_post_from_db.title }}</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
                <div class="level-right" style="margin-top: 8px">
                    <div class="level-item">
                        <a class="button" href="#">
                            <span class="icon is-medium">
                                <i class="fab fa-lg fa-github"></i>
                            </span>
                            <span>GitHub</span>
                        </a>
                        &nbsp;
                        <a class="button" href="#">
                            <span class="icon is-medium">
                                <i class="fab fa-lg fa-linkedin"></i>
                            </span>
                            <span>LinkedIn</span>
                        </a>
                    </div>
                </div>
            </div>
            <div class="dropdown-divider" style="margin-bottom: 16px"></div>
            
            <div class="content">
                <article>
                    <h1 class="title is-2">{{ single_post_from_db.title }}</h1>
                    
                    <div class="level is-mobile mb-5">
                        <div class="level-left">
                            <div class="level-item">
                                <span class="has-text-grey">
                                    <strong>Subtitle:</strong> {{ single_post_from_db.signature }}
                                </span>
                            </div>
                        </div>
                        <div class="level-right">
                            <div class="level-item">
                                <span class="has-text-grey-light">
                                    <strong>Published:</strong> {{ single_post_from_db.date }}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="box">
                        {{ single_post_from_db.body }}
                    </div>
                </article>
            </div>
            
            <div class="dropdown-divider" style="margin-top: 16px"></div>
        </div>
    </section>
</body>
</html>
